# Chromium / Google Chrome の起動フラグ (bash 配列。fb-session が source する)
FB_CHROMIUM_FLAGS_BASE=(
  --ozone-platform=x11
  --no-sandbox                  # proot 内では setuid/namespace サンドボックスが使えない
  --disable-dev-shm-usage       # /dev/shm が小さい/ない環境向け
  --password-store=basic        # キーリングなし
  --no-first-run
  --no-default-browser-check
  --touch-events=enabled
  --enable-features=OverlayScrollbar
  --disable-breakpad
  --disable-crash-reporter
)
FB_CHROMIUM_FLAGS_LOWMEM=(
  --renderer-process-limit=3
  --process-per-site
  --enable-low-end-device-mode
)
FB_CHROMIUM_FLAGS_GPU_OFF=(
  --disable-gpu
)
