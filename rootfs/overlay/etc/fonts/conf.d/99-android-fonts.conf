<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- FULL-BROWSER: Android 本体のフォント (/system/fonts を proot でバインド) を使う。
     Noto Sans CJK JP (日本語) と Roboto が使えるため、フォントパッケージを rootfs に入れなくてよい。 -->
<fontconfig>
  <dir>/system/fonts</dir>
  <alias><family>sans-serif</family><prefer><family>Noto Sans CJK JP</family><family>Roboto</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Noto Serif CJK JP</family><family>Noto Serif</family><family>DejaVu Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>DejaVu Sans Mono</family><family>Noto Sans Mono CJK JP</family></prefer></alias>
  <match target="pattern"><test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK JP</string></edit></match>
</fontconfig>
