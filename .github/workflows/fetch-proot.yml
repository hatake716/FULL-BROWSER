name: fetch-proot

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils curl xz-utils
      - run: native/fetch-proot-from-termux.sh android/app
      - uses: actions/upload-artifact@v4
        with:
          name: proot-arm64
          path: |
            android/app/src/main/jniLibs
            android/app/src/main/assets/proot
